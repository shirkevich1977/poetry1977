<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ширкевич Валентина Васильевна — Поэзия</title>
    <style>
        /* Стиль старой бумажной страницы */
        body { background-color: #f6f3ea; color: #2b2b2b; font-family: "Georgia", serif; line-height: 1.9; margin: 0; display: flex; flex-direction: column; align-items: center; }
        header { text-align: center; margin-top: 50px; }
        .author-photo { width: 180px; height: 240px; object-fit: cover; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 6px solid #fff; margin-bottom: 20px; }
        header h1 { font-size: 1.4rem; font-weight: normal; letter-spacing: 2px; text-transform: uppercase; color: #4a4a4a; margin-bottom: 5px; }
        .content-container { display: flex; max-width: 900px; width: 90%; margin: 40px 0; gap: 50px; }
        main { flex: 2; text-align: center; }
        .poem-title { font-style: italic; font-size: 2rem; margin-bottom: 30px; }
        .poem-text { font-size: 1.2rem; text-align: left; display: inline-block; white-space: pre-line; }
        sidebar { flex: 1; border-left: 1px solid #e0dbcd; padding-left: 30px; }
        .poem-list { list-style: none; padding: 0; }
        .poem-list a { color: #6e5d4f; text-decoration: none; cursor: pointer; }
        .interactive-section { max-width: 600px; width: 85%; margin: 40px 0; border-top: 1px solid #e0dbcd; padding-top: 40px; }
        .social-links { text-align: center; margin-bottom: 40px; }
        .social-links a { margin: 0 12px; color: #555; text-decoration: none; border: 1px solid #ccc; padding: 6px 16px; border-radius: 20px; }
        .feedback-form input, .feedback-form textarea { width: 100%; box-sizing: border-box; background-color: #faf8f5; border: 1px solid #c9c2b3; padding: 12px; margin-bottom: 15px; }
        .feedback-form button { background-color: #4a5d4e; color: white; border: none; padding: 12px; cursor: pointer; width: 100%; }
        .success-message { display: none; color: #3b5a3e; text-align: center; }
        @media (max-width: 768px) { .content-container { flex-direction: column; } sidebar { border-left: none; padding-left: 0; } }
    </style>
</head>
<body>
    <header>
        <img src="author.jpg" alt="Валентина Васильевна Ширкевич" class="author-photo" onerror="this.style.display='none';">
        <h1>Ширкевич Валентина Васильевна</h1>
    </header>
    <div class="content-container">
        <main>
            <h2 class="poem-title" id="current-title">Весна в моём городе</h2>
            <div class="poem-text" id="current-text">...текст стихотворения...</div>
        </main>
        <sidebar>
            <h3>Другие стихи</h3>
            <ul class="poem-list">
                <li><a onclick="changePoem(0)">Весна в моём городе</a></li>
                <li><a onclick="changePoem(1)">Дыхание земли</a></li>
            </ul>
        </sidebar>
    </div>
    <div class="interactive-section">
        <div class="social-links">
            <a href="https://stihi.ru/avtor/shirkevichvaly" target="_blank">Стихи.ру</a>
        </div>
        <div class="feedback-form">
            <form id="commentForm" onsubmit="sendFeedback(event)">
                <input type="text" placeholder="Ваше имя" required>
                <textarea rows="4" placeholder="Ваш отзыв..." required></textarea>
                <button type="submit">Отправить</button>
                <div class="success-message" id="successMsg">Спасибо!</div>
            </form>
        </div>
    </div>
    <script>
        const poems = [ { title: "Весна...", text: "..." }, { title: "Дыхание...", text: "..." } ];
        function changePoem(index) {
            document.getElementById('current-title').innerText = poems[index].title;
            document.getElementById('current-text').innerText = poems[index].text;
        }
        function sendFeedback(event) { event.preventDefault(); document.getElementById('successMsg').style.display = 'block'; }
    </script>
</body>
</html>
